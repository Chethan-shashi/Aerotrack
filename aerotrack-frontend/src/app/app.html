<div class="shell">
  @if (showHeader()) {
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>
        </span>
        <span class="brand-name">AeroTrack</span>
        <span class="live-pill"><span class="dot"></span>LIVE</span>
      </div>

      <button type="button" class="btn-ghost" (click)="logout()">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M16 13v-2H7V8l-5 4 5 4v-3zM20 3h-8v2h8v14h-8v2h8a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/></svg>
        Sign out
      </button>
    </header>
  }

  <!-- Angular will inject either the LoginComponent or MapComponent here based on the URL -->
  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
