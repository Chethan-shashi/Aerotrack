<div class="login-wrapper" style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f7f6;">
  <div class="login-card" style="padding: 2rem; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px;">
    <h2 style="text-align: center; margin-bottom: 1.5rem;">AeroTrack Login</h2>
    
    <form (ngSubmit)="onSubmit()">
      <div style="margin-bottom: 1rem;">
        <label style="display: block; margin-bottom: 0.5rem;">Username</label>
        <input type="text" [(ngModel)]="username" name="username" required style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
      </div>
      
      <div style="margin-bottom: 1.5rem;">
        <label style="display: block; margin-bottom: 0.5rem;">Password</label>
        <input type="password" [(ngModel)]="password" name="password" required style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
      </div>
      
      <button type="submit" style="width: 100%; padding: 0.75rem; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem;">
        Login
      </button>
    </form>
  </div>
</div>
