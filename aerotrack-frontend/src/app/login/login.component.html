<div class="login-page">
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>

  <div class="card">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>
      </span>
      <h1>AeroTrack</h1>
      <p class="subtitle">Real-time flight tracking console</p>
    </div>

    <form (ngSubmit)="login()" novalidate>
      @if (errorMessage()) {
        <div class="alert" role="alert">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-2h2zm0-4h-2V7h2z"/></svg>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <label class="field">
        <span class="label">Username</span>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4 0-8 2-8 5v3h16v-3c0-3-4-5-8-5z"/></svg>
          <input
            type="text"
            [(ngModel)]="credentials.username"
            name="username"
            autocomplete="username"
            placeholder="Enter username"
            required
            autofocus
          >
        </div>
      </label>

      <label class="field">
        <span class="label">Password</span>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M17 9V7A5 5 0 0 0 7 7v2H5v13h14V9zm-8-2a3 3 0 0 1 6 0v2H9z"/></svg>
          <input
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="credentials.password"
            name="password"
            autocomplete="current-password"
            placeholder="Enter password"
            required
          >
          <button
            type="button"
            class="toggle"
            (click)="showPassword.set(!showPassword())"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          >
            {{ showPassword() ? 'Hide' : 'Show' }}
          </button>
        </div>
      </label>

      <button type="submit" class="submit" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner" aria-hidden="true"></span>
          Signing in…
        } @else {
          Sign in
        }
      </button>
    </form>

    <p class="footer">© AeroTrack · Secure operator access</p>
  </div>
</div>
